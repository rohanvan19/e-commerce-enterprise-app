services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cocoa_local
      POSTGRES_USER: cocoa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cocoa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocoa -d cocoa_local"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cocoa_postgres:
